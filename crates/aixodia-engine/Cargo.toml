[package]
name = "aixodia-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aixodia-engine"
path = "src/main.rs"

[features]
# The screen pane needs X11 linked into the binary, and a machine without those
# libraries cannot load the engine at all — the terminal and the chat die with a
# feature that machine could not have used anyway. Off, the same source builds a
# program that mentions no X.
default = ["screen"]
screen = ["dep:aixodia-screen"]

[dependencies]
aixodia-net = { path = "../aixodia-net" }
aixodia-state = { path = "../aixodia-state" }
aixodia-config = { path = "../aixodia-config" }
aixodia-db = { path = "../aixodia-db" }
aixodia-goals = { path = "../aixodia-goals" }
aixodia-io = { path = "../aixodia-io" }
aixodia-mobile = { path = "../aixodia-mobile" }
aixodia-provider = { path = "../aixodia-provider" }
aixodia-relay = { path = "../aixodia-relay" }
aixodia-run = { path = "../aixodia-run" }
aixodia-selfupdate = { path = "../aixodia-selfupdate" }
aixodia-session = { path = "../aixodia-session" }
aixodia-screen = { path = "../aixodia-screen", optional = true }
aixodia-terminal = { path = "../aixodia-terminal" }
aixodia-tools = { path = "../aixodia-tools" }
anyhow.workspace = true
base64.workspace = true
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
futures-util.workspace = true
hmac.workspace = true
libc.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
jsonwebtoken = "9"

[dev-dependencies]
tempfile.workspace = true
