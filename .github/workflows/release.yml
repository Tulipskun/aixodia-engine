name: Release engine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  # The launcher and installer are shell; they need no compiler and no
  # cross toolchain, so they are checked here while the builds run elsewhere.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher and installer tests
        run: |
          bash aixodia_test.sh
          bash install_test.sh

  # Each architecture is built on a runner of that architecture. Cross-compiling
  # arm64 from an x86 runner meant a second full C build of BoringSSL through an
  # emulated-aarch64 sysroot, which was the largest single cost of a release.
  #
  # The runners are deliberately not the newest ones: a binary links against the
  # glibc of the machine that built it. Built on 24.04 it asked for
  # GLIBC_2.38/2.39 and died at start on a Debian 12 host — "version `GLIBC_2.38'
  # not found" — after installing cleanly. Built on 22.04 it asks for 2.35 and
  # loads from Debian 12 and Ubuntu 22.04 onwards.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins 1.99.1; installing it here (with rustfmt)
          # stops rustup's silent auto-install, which ships no components.
          toolchain: '1.99.1'
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate keys per target, or one architecture's artifacts evict the
          # other's from the same cache entry — and per runner image, because
          # crate `cache-on-failure` artifacts built against 24.04's headers were
          # reused on a 22.04 runner and failed to link with `undefined symbol:
          # __isoc23_sscanf`, a glibc 2.38 symbol that 22.04 does not have.
          key: ${{ matrix.suffix }}-${{ matrix.runner }}
          # The release profile is a distinct artifact set from the test profile.
          cache-on-failure: false

      - name: Install X11 development libraries
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                libx11-dev libxext-dev libxtst-dev cmake clang libclang-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1

      - name: Format and test
        run: |
          cargo fmt --all -- --check
          cargo test -p aixodia-engine

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p aixodia-engine
          cp target/${{ matrix.target }}/release/aixodia-engine aixodia-engine-linux-${{ matrix.suffix }}
          # The same engine with the screen pane left out, for a machine with no
          # X libraries: the pane links libX11/libXext/libXtst/libXfixes, and a
          # binary that needs them cannot load at all on a host without them —
          # measured, the whole engine died over a pane that host could not have
          # used anyway. This build mentions no X.
          cargo build --release --target ${{ matrix.target }} -p aixodia-engine --no-default-features
          cp target/${{ matrix.target }}/release/aixodia-engine \
             aixodia-engine-linux-${{ matrix.suffix }}-noscreen
          if ldd aixodia-engine-linux-${{ matrix.suffix }}-noscreen | grep -qE 'libX11|libXfixes'; then
            echo "the no-screen build still links X" >&2
            exit 1
          fi

      - name: The binaries must load on a host older than this runner
        run: |
          # The floor this project promises: the glibc of Ubuntu 22.04. A runner
          # upgrade raises it silently — not a build error, a binary that dies at
          # start on the user's machine — so it is checked here instead of being
          # discovered there.
          floor=2.35
          for name in aixodia-engine-linux-${{ matrix.suffix }} \
                      aixodia-engine-linux-${{ matrix.suffix }}-noscreen; do
            worst=$(objdump -T "$name" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' |
                    sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$name asks for GLIBC_$worst"
            if [ "$(printf '%s\n%s\n' "$floor" "$worst" | sort -V | tail -1)" != "$floor" ]; then
              echo "$name asks for GLIBC_$worst, above the promised floor $floor" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.suffix }}
          path: |
            aixodia-engine-linux-${{ matrix.suffix }}
            aixodia-engine-linux-${{ matrix.suffix }}-noscreen
          if-no-files-found: error

  publish:
    needs: [shell, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release view engine-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create engine-latest --repo "$GITHUB_REPOSITORY" \
              --title "engine-latest" --notes "Rolling build of main"
          gh release upload engine-latest \
            dist/aixodia-engine-linux-amd64 dist/aixodia-engine-linux-arm64 \
            dist/aixodia-engine-linux-amd64-noscreen dist/aixodia-engine-linux-arm64-noscreen \
            --repo "$GITHUB_REPOSITORY" --clobber
          # The installer fetches the plain name on the architecture it runs on,
          # so the amd64 build is also published under it.
          cp dist/aixodia-engine-linux-amd64 aixodia-engine
          gh release upload engine-latest aixodia-engine --repo "$GITHUB_REPOSITORY" --clobber
