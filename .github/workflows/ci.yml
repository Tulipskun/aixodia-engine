name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Shell only: no compiler at all, so it finishes long before the Rust job and
  # reports the launcher problems first.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher and installer tests
        run: |
          bash aixodia_test.sh
          bash install_test.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins 1.99.1; installing it here (with rustfmt)
          # stops rustup's silent auto-install, which ships no components.
          toolchain: '1.99.1'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install the C toolchain the bundled codecs build with
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                cmake clang libclang-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1

      - name: Format validation
        run: cargo fmt --all -- --check

      # The build step is redundant: `cargo test` compiles the same crates, and
      # `cargo clippy` reuses them. Running it separately paid for a third pass.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy -p aixodia-engine --bin aixodia-engine --no-deps -- -D warnings

      # The pane is a feature so a machine without X can still run the engine.
      # That promise is a property of the binary, so it is checked on the binary.
      - name: The no-screen build needs no X
        run: |
          cargo build -p aixodia-engine --no-default-features
          if ldd target/debug/aixodia-engine | grep -qE 'libX11|libXfixes|libXext'; then
            echo "the no-screen build still links X" >&2
            exit 1
          fi
