[package]
name = "aixodia-provider"
description = "Provider adapters: shared types, openai and opencode (port of provider/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
url.workspace = true
# BoringSSL-backed client, used only by the Opencode adapter to present the
# official client's ClientHello. Its types are kept out of the shared code.
wreq = { version = "0.16", default-features = false, features = ["json", "stream", "charset", "webpki-roots", "tokio-rt"] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
