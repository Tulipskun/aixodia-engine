name: Release engine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  # The launcher and installer are shell; they need no compiler and no
  # cross toolchain, so they are checked here while the builds run elsewhere.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher and installer tests
        run: |
          bash aixodia_test.sh
          bash install_test.sh

  # Each architecture is built on a runner of that architecture. Cross-compiling
  # arm64 from an x86 runner meant a second full C build of BoringSSL through an
  # emulated-aarch64 sysroot, which was the largest single cost of a release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins 1.99.1; installing it here (with rustfmt)
          # stops rustup's silent auto-install, which ships no components.
          toolchain: '1.99.1'
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate keys per target, or one architecture's artifacts evict the
          # other's from the same cache entry.
          key: ${{ matrix.suffix }}
          # The release profile is a distinct artifact set from the test profile.
          cache-on-failure: false

      - name: Install X11 development libraries
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                libx11-dev libxext-dev libxtst-dev cmake clang libclang-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1

      - name: Format and test
        run: |
          cargo fmt --all -- --check
          cargo test -p aixodia-engine

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p aixodia-engine
          cp target/${{ matrix.target }}/release/aixodia-engine aixodia-engine-linux-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.suffix }}
          path: aixodia-engine-linux-${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    needs: [shell, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release view engine-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create engine-latest --repo "$GITHUB_REPOSITORY" \
              --title "engine-latest" --notes "Rolling build of main"
          gh release upload engine-latest \
            dist/aixodia-engine-linux-amd64 dist/aixodia-engine-linux-arm64 \
            --repo "$GITHUB_REPOSITORY" --clobber
          # The installer fetches the plain name on the architecture it runs on,
          # so the amd64 build is also published under it.
          cp dist/aixodia-engine-linux-amd64 aixodia-engine
          gh release upload engine-latest aixodia-engine --repo "$GITHUB_REPOSITORY" --clobber
