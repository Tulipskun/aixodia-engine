name: Release engine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins 1.99.1; installing it here (with rustfmt)
          # stops rustup's silent auto-install, which ships no components.
          toolchain: '1.99.1'
          components: rustfmt
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install cross linker (arm64) and BoringSSL build deps
        # apt is retried because the runner's mirror resolution has been
        # flaky: a DNS blip on archive.ubuntu.com fails the whole release even
        # though nothing is wrong with the code being released.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                cmake ninja-build clang libclang-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1

      - name: Test foreground engine and launcher
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml -p aixodia-engine
          bash aixodia_test.sh

      - name: Build amd64
        working-directory: rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p aixodia-engine
          cp target/x86_64-unknown-linux-gnu/release/aixodia-engine ../aixodia-engine-linux-amd64

      - name: Build arm64
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p aixodia-engine
          cp target/aarch64-unknown-linux-gnu/release/aixodia-engine ../aixodia-engine-linux-arm64

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view engine-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create engine-latest --repo "$GITHUB_REPOSITORY"               --title "engine-latest" --notes "Rolling build of main"
          gh release upload engine-latest aixodia-engine-linux-amd64 aixodia-engine-linux-arm64             --repo "$GITHUB_REPOSITORY" --clobber
          cp aixodia-engine-linux-amd64 aixodia-engine
          gh release upload engine-latest aixodia-engine --repo "$GITHUB_REPOSITORY" --clobber
